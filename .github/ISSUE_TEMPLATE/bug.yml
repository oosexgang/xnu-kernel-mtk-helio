name: Something does not work
description: A build, a check or a run that does not do what the docs say.
labels: [bug]
body:
  - type: input
    id: board
    attributes:
      label: Board
      description: The device package (arch/arm64/boot/dts/NAME), or "none" for a build or a host check.
      placeholder: x6826b
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: "`git rev-parse --short HEAD` of main, and of the devices branch if a package is involved."
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: What was run
      description: The exact command, with its environment variables (XNU_ARGS, HAKIOS_PAYLOAD, METAL ...).
      render: sh
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What was expected, and what happened
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: The log
      description: >
        The lines around the failure: the run's log (XNU_LOG_OUT), Android's pstore after a run that did not
        come back, or the build's output. Remove the phone's serial number and any Wi-Fi passphrase first.
      render: text
  - type: input
    id: host
    attributes:
      label: Host
      description: macOS or Linux version, and the compiler (`cc --version`).
