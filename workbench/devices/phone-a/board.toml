# A made-up phone for the tests: no address here is a real phone's.
name = "phone-a"
description = "Stand-in A"
soc = "mt0001"
features = ["emmc-msdc", "battery-mt6358", "keys-mt6358", "touch-td4160"]

[loader]
kernel_load = 0x41080000
chain_stub = 0x4b000000
xnu_base = 0xd0000000
xnu_size = 0x80000000
marker = 0x81000000
panic_log = 0x81100000
panic_log_size = 0x80000
scratch = 0x51000000
test_buffer = 0xa1000000
core_order = [0, 6, 7, 1, 2, 3, 4, 5]
system_partition = "sysa"

[ramoops]
console = 0x4e09f000
console_size = 0x40000
pmsg = 0x4e0e0000
pmsg_size = 0x10000

[display]
fb_base = 0x797b0000
fb_size = 0x1000000
fb_pitch = 4352
width = 1080
height = 2400

[battery]
design_uah = 4000000

[boot]
android_device = "stand-in-a"
cpus = 4
bootargs = ["touchscreen=2"]
